name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ARGUS.spec
      - argus_launcher.py
      - installer/**
      - scripts/package_*.sh
      - assets/argus.ico
      - requirements*.txt
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - run: python -m pip install --upgrade pip
      # "." adds the CLI's base dependencies (rich, prompt-toolkit), which requirements.txt lacks.
      - run: python -m pip install -r requirements.txt . pyinstaller==6.22.3
      - run: python -m unittest tests.test_argus_launcher

      - name: Resolve version
        id: version
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("${{ github.ref_type }}" -eq "tag" -and "v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match pyproject version $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - run: pyinstaller --noconfirm ARGUS.spec
      - name: Check key libraries are bundled
        run: |
          # pywinauto is skipped by the DLL probe in ARGUS.spec but must still ship.
          foreach ($module in "'rich'", "'prompt_toolkit'", "'pywinauto'") {
            if (-not (Select-String -Path build\ARGUS\PYZ-00.toc -Pattern $module -SimpleMatch -Quiet)) { throw "$module missing from the bundle" }
          }

      - name: Smoke test the console build
        run: |
          $argus = Resolve-Path dist\ARGUS\argus.com
          if (-not (Test-Path dist\ARGUS\ARGUS.exe)) { throw "ARGUS.exe missing" }
          & $argus --version
          if ($LASTEXITCODE -ne 0) { throw "argus --version exited $LASTEXITCODE" }
          # No key on the runner: doctor must report it with exit 1 and make no Gemini request.
          Remove-Item Env:GEMINI_API_KEY, Env:ARGUS_LLM_GEMINI_API_KEY -ErrorAction SilentlyContinue
          $env:ARGUS_HOME = Join-Path $env:RUNNER_TEMP "argus-home"
          $doctor = & $argus doctor 2>&1 | Out-String
          Write-Output $doctor
          if ($LASTEXITCODE -ne 1) { throw "argus doctor exited $LASTEXITCODE, expected 1" }
          if ($doctor -notmatch "No usable API key found") { throw "doctor did not report the missing key" }
          # Actions ends pwsh steps with $LASTEXITCODE, which is doctor's expected 1.
          exit 0

      - name: Build installer and portable zip
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.value }} installer\argus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          Compress-Archive -Path dist\ARGUS -DestinationPath dist\ARGUS-windows-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: argus-windows-${{ steps.version.outputs.value }}
          path: |
            dist/ARGUS-windows-x64-setup.exe
            dist/ARGUS-windows-x64-portable.zip
          if-no-files-found: error

  linux:
    # 22.04 keeps the glibc floor low, so the build runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 xvfb
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt . pyinstaller==6.22.3
      - run: python -m unittest tests.test_argus_launcher
      - name: Resolve version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${{ github.ref_type }}" = tag ] && [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match pyproject version $version" >&2; exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: pyinstaller --noconfirm ARGUS.spec
      - name: Check key libraries are bundled
        run: for module in "'rich'" "'prompt_toolkit'"; do grep -qF "$module" build/ARGUS/PYZ-00.toc || { echo "$module missing from the bundle" >&2; exit 1; }; done
      - run: scripts/package_linux.sh ${{ steps.version.outputs.value }}
      - name: Install the .deb
        run: |
          sudo apt-get install -y ./dist/ARGUS-linux-x86_64.deb
          test -f /usr/share/applications/argus.desktop
          # /usr/bin/argus, not `command -v argus`: pip install . also put an argus on PATH.
          test "$(readlink -f /usr/bin/argus)" = /usr/lib/argus/ARGUS
      # The installed copy is read-only for the runner user, like on a real system.
      - name: Smoke test the installed build
        run: scripts/smoke_unix_build.sh /usr/lib/argus/ARGUS
      - uses: actions/upload-artifact@v4
        with:
          name: argus-linux-${{ steps.version.outputs.value }}
          path: |
            dist/ARGUS-linux-x86_64.deb
            dist/ARGUS-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt . pyinstaller==6.22.3
      - run: python -m unittest tests.test_argus_launcher
      - name: Resolve version
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${{ github.ref_type }}" = tag ] && [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match pyproject version $version" >&2; exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: pyinstaller --noconfirm ARGUS.spec
      - name: Check key libraries are bundled
        run: for module in "'rich'" "'prompt_toolkit'"; do grep -qF "$module" build/ARGUS/PYZ-00.toc || { echo "$module missing from the bundle" >&2; exit 1; }; done
      - name: Smoke test the build
        run: scripts/smoke_unix_build.sh dist/ARGUS.app/Contents/MacOS/ARGUS
      - run: scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: argus-macos-${{ steps.version.outputs.value }}
          path: dist/ARGUS-macos-arm64.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum ARGUS-* > SHA256SUMS.txt
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Argus $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
