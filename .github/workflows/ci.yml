name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cli-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and smoke-test the isolated CLI package
        run: python scripts/verify_cli_wheel.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: argus_test
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://argus:argus@localhost:5432/argus_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-jwt-secret-with-sufficient-length
      ARGUS_ENCRYPTION_KEY: ci-encryption-secret-with-sufficient-length
      ARGUS_ENV: test
      AUTO_CREATE_TABLES: "0"
      ARGUS_QA_MODE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-api.txt
            requirements-dev.txt
      - name: Install native libraries for headless desktop imports
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libportaudio2 xvfb
      - run: pip install -r requirements-dev.txt
      - name: Prepare isolated QA workspace
        env:
          ARGUS_QA_WORKSPACE: ${{ runner.temp }}/argus-qa
        run: mkdir -p "$ARGUS_QA_WORKSPACE"
      - run: alembic upgrade head
      - name: Run full Python suite
        env:
          ARGUS_QA_WORKSPACE: ${{ runner.temp }}/argus-qa
        run: xvfb-run --auto-servernum python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
