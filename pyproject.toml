[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-mark-xxxix"
version = "0.1.0"
description = "ARGUS text CLI and local assistant"
requires-python = ">=3.11"

[project.scripts]
argus = "cli.app:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["actions*", "agent*", "api*", "awareness*", "audio*", "cli*", "config*", "core*", "llm_providers*", "memory*", "observability*", "plugins*", "tools*", "ui*"]

[tool.setuptools.package-data]
core = ["prompt.txt"]
